<!-- Panneau du menu mobile (caché hors de l'écran tant que le menu est fermé) -->
<div class="site-mobile-menu">
  <div class="site-mobile-menu-header">
    <div class="site-mobile-menu-close">
      <span class="icon-close2" role="button" tabindex="0" aria-label="Fermer le menu"
            (click)="layout.closeMenu()" (keydown.enter)="layout.closeMenu()"></span>
    </div>
    <div class="site-mobile-menu-logo">
      <a routerLink="/" (click)="layout.closeMenu()"><strong class="text-primary">Medi</strong>Flow</a>
    </div>
  </div>
  <div class="site-mobile-menu-body">
    <ul class="site-nav-wrap" (click)="layout.closeMenu()">
      @for (lien of liens; track lien.chemin) {
        <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: lien.exact }">
          <a [routerLink]="lien.chemin">{{ lien.libelle }}</a>
        </li>
      }
    </ul>
  </div>
</div>

<!-- Barre de navigation -->
<div class="site-navbar py-2">
  <div class="container">
    <div class="d-flex align-items-center justify-content-between">

      <div class="logo">
        <div class="site-logo">
          <a routerLink="/"><strong class="text-primary">Medi</strong>Flow</a>
        </div>
      </div>

      <div class="main-nav d-none d-lg-block">
        <nav class="site-navigation text-right text-md-center" role="navigation">
          <ul class="site-menu d-none d-lg-block">
            @for (lien of liens; track lien.chemin) {
              <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: lien.exact }">
                <a [routerLink]="lien.chemin">{{ lien.libelle }}</a>
              </li>
            }
          </ul>
        </nav>
      </div>

      <div class="icons">
        <a href="#" class="site-menu-toggle ml-3 d-inline-block d-lg-none"
           aria-label="Ouvrir le menu" [attr.aria-expanded]="layout.menuOpen()"
           (click)="basculerMenu($event)">
          <span class="icon-menu"></span>
        </a>
      </div>

    </div>
  </div>
</div>
