<div class="site-blocks-cover overlay" style="background-image: url('images/hero_bg_2.jpg');">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 mx-auto align-self-center">
        <div class="site-block-cover-content text-center">
          <h1 class="mb-0">Bienvenue sur <strong class="text-primary">MediFlow</strong></h1>
          <div class="row justify-content-center mb-5">
            <div class="col-lg-6 text-center">
              <p>Vos rendez-vous, votre dossier médical et vos ordonnances, au même endroit.</p>
            </div>
          </div>
          <p><a routerLink="/dossier" class="btn btn-primary px-5 py-3">Mon dossier médical</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="site-section site-section-sm site-blocks-1 border-0">
  <div class="container">
    <div class="row">
      @for (f of fonctionnalites; track f.titre) {
        <div class="col-md-6 col-lg-4 d-lg-flex mb-5 pl-4">
          <div class="icon mr-4 align-self-start">
            <span class="icon-check_circle text-primary"></span>
          </div>
          <div class="text">
            <h2>{{ f.titre }}</h2>
            <p>{{ f.texte }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</div>
