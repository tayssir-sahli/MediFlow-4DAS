server.port=9090
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Route : /api/dossiers/** -> dossier-service
spring.cloud.gateway.routes[0].id=dossier-service
spring.cloud.gateway.routes[0].uri=lb://dossier-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/dossiers/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# CORS pour le front Angular
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG