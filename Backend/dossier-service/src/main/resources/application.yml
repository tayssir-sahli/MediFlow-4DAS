server:
  port: 8083
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    instance:
      prefer-ip-address: true
spring:
  application:
    name: dossier-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/dossier_db
      auto-index-creation: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
